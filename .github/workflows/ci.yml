name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: mise run check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      # Generated files are committed. Regenerate them and fail on a difference
      # so a stale or hand-edited artifact cannot reach main.
      - run: mise run codegen
      - run: git diff --exit-code

      - run: mise run check

      - name: Lint commit messages
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: pnpm commitlint:ci

      - name: Scan the Git history for secrets
        run: mise run secrets

      - name: Check for breaking API changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: mise run contract:breaking

      - name: Scan dependencies for vulnerabilities
        run: mise run audit
