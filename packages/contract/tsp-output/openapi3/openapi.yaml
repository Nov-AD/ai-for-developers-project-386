openapi: 3.1.0
info:
  title: Call scheduling API
  description: API for scheduling calls with a single calendar owner.
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: getHealth
      description: Service health check.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Service status.
      description: Health check response.
servers:
  - url: http://localhost:3000
    description: Local development
    variables: {}
